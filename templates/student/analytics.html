{% include 'partials/header.html' %}
<div class="container-fluid">
  <div class="row">
    {% include 'partials/student_sidebar.html' %}
    <div class="col-md-9 p-4">
      <h2>Performance Analytics</h2>
      <div class="card card-elevated p-3">
        <canvas id="studentChart"></canvas>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
  const labels = {{ subjectPerf|map(attribute='subject_name')|list|tojson }};
  const data = {{ subjectPerf|map(attribute='percentage')|list|tojson }};

  new Chart(document.getElementById('studentChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Percentage',
        data,
        borderColor: '#2f7ac7',
        backgroundColor: 'rgba(47, 122, 199, 0.2)',
        tension: 0.3
      }]
    },
    options: { scales: { y: { beginAtZero: true, max: 100 } } }
  });
</script>
