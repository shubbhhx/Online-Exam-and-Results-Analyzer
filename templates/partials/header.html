<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title if title is defined and title else 'Dashboard' }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body
  data-page-loading="{{ 'true' if pageLoading is defined and pageLoading else 'false' }}"
  data-toast-message="{{ toast.message if toast is defined and toast and toast.message else '' }}"
  data-toast-type="{{ toast.type if toast is defined and toast and toast.type else '' }}"
>
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
  <div class="container-fluid">
    <span class="navbar-brand fw-bold d-flex align-items-center gap-2">
      <i class="bi bi-mortarboard"></i>
      Online Exam System
    </span>
    {% if not user and showAuthButtons %}
      <div class="d-flex align-items-center gap-2 ms-auto">
        <span id="liveDateTime" class="badge bg-light text-dark border"></span>
      </div>
    {% endif %}
    {% if user %}
      <div class="d-flex align-items-center gap-3">
        <span class="nav-chip">Welcome, {{ user.name }}</span>
        <a class="btn btn-sm btn-outline-dark" href="/logout">Logout</a>
      </div>
    {% endif %}
  </div>
</nav>
